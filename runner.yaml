runner:
  name: Wise TCP Port Checker
  description: Check if a TCP port is open on a remote server.
  version: 0.0.1

build:
  commands: |
    echo "START: Building the runner"
    python3 -m pip install -U -r requirements.txt
    echo "END: Building the runner"

webform:
  - name: ip_address
    prompt: IP Address
    type: text
  - name: tcp_ports
    prompt: TCP Ports, comma separated (e.g. 80,443,22)
    type: text

launch:
  command: app.py --ip_address ${ip_address} --tcp_ports ${tcp_ports}